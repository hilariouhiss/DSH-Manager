<!-- lucide: chevron-down（24×24 官方几何，stroke-width 2）——
     下拉框自带的箭头。原先用 Fluent ComboBox 内置的 _dropdown.svg，与本项目
     图标体系无关；换成 lucide 同族几何后，粗细与颜色（#9C9CA8）跟其余图标一致。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9C9CA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
