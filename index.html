<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH 管理器</title>
    <script type="module" src="/src/main.ts" defer></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body>
    <header class="bar">
      <div class="bar-left">
        <span class="wordmark">DSH 管理器</span>
        <span id="env-scope" class="bar-scope"></span>
      </div>
      <div class="bar-right">
        <span id="fresh" class="fresh">正在检测…</span>
        <button id="btn-primary" class="btn primary" type="button">启动</button>
      </div>
    </header>

    <div class="sheet-wrap">
      <main class="sheet">
        <div class="sheet-inner">
          <div id="banner" class="banner hidden"></div>

          <div class="title-row">
            <h1>本机 DSH</h1>
            <p id="finding" class="finding">正在检测本机实例…</p>
            <p id="env-detail" class="env-detail"></p>
          </div>

          <section class="block">
            <div class="block-head">
              <h2>运行状态</h2>
              <div class="block-actions">
                <label class="field">端口 <input id="port" type="number" min="1" max="65535" value="3080" /></label>
                <button id="btn-restart" class="btn" type="button" disabled>重启</button>
                <button id="btn-open" class="btn" type="button" disabled>打开界面</button>
              </div>
            </div>
            <div class="facts">
              <div class="cell"><span class="cell-label">状态</span><span id="status-value" class="cell-value muted">—</span></div>
              <div class="cell"><span class="cell-label">端口</span><span id="port-cell" class="cell-value mono">—</span></div>
              <div class="cell"><span class="cell-label">进程</span><span id="pid-cell" class="cell-value mono">—</span></div>
              <div class="cell"><span class="cell-label">实例</span><span id="manage-cell" class="cell-value muted">—</span></div>
            </div>
            <div class="settings">
              <label class="check"><input id="open-browser" type="checkbox" checked /> 启动后打开浏览器</label>
              <span id="busy" class="busy hidden"></span>
            </div>
          </section>

          <section class="block">
            <div class="block-head">
              <h2>版本</h2>
              <div class="block-actions">
                <span id="installed-version" class="installed">读取中…</span>
                <button id="btn-check" class="btn" type="button">检查更新</button>
              </div>
            </div>
            <div id="tags" class="channels"></div>
            <div class="settings">
              <label class="check"><input id="restart-after" type="checkbox" checked /> 安装完成后重新启动 DSH</label>
            </div>
            <div id="version-list" class="versions"><p class="empty">正在读取版本列表…</p></div>
            <button id="btn-show-all" class="btn quiet more hidden" type="button">显示全部版本</button>
          </section>

          <section class="block">
            <div class="block-head">
              <h2>日志</h2>
              <div class="tabs">
                <button class="tab active" data-kind="web" type="button">运行</button>
                <button class="tab" data-kind="npm" type="button">npm</button>
              </div>
            </div>
            <pre id="log" class="log">（暂无输出）</pre>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
