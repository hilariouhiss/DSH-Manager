<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH 管理器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar">
      <div class="brand">DSH 管理器</div>
      <div id="env-line" class="env">正在读取环境…</div>
    </header>

    <div id="banner" class="banner hidden"></div>

    <main>
      <section class="card">
        <div class="card-head">
          <h2>运行状态</h2>
          <span id="status-badge" class="badge">检测中</span>
        </div>
        <div class="status-line">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">正在检测…</span>
          <span id="status-meta" class="muted"></span>
        </div>
        <div class="row">
          <label class="field">端口 <input id="port" type="number" min="1" max="65535" value="3080" /></label>
          <label class="check"><input id="open-browser" type="checkbox" checked /> 启动后打开浏览器</label>
        </div>
        <div class="row buttons">
          <button id="btn-start" class="primary">启动</button>
          <button id="btn-stop" class="danger">停止</button>
          <button id="btn-restart" class="ghost">重启</button>
          <button id="btn-open" class="ghost">打开界面</button>
        </div>
        <div id="busy" class="busy hidden"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>版本</h2>
          <div class="head-right">
            <span id="installed-version" class="muted">读取中…</span>
            <button id="btn-check" class="ghost small">检查更新</button>
          </div>
        </div>
        <div id="tags" class="tags"></div>
        <label class="check"><input id="restart-after" type="checkbox" checked /> 安装完成后重新启动 DSH</label>
        <div id="version-list" class="versions"><p class="muted">正在读取版本列表…</p></div>
        <button id="btn-show-all" class="ghost small hidden">显示全部版本</button>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>日志</h2>
          <div class="tabs">
            <button class="tab active" data-kind="web">运行</button>
            <button class="tab" data-kind="npm">npm</button>
          </div>
        </div>
        <pre id="log" class="log">（暂无输出）</pre>
      </section>
    </main>
  </body>
</html>
